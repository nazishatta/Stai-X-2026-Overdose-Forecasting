[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stai-x-2026-overdose-forecasting"
version = "0.1.0"
description = "Solo Kaggle project for STAI-X Challenge 2026 overdose ED visit rate forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nazishatta" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]
modeling = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "statsmodels>=0.14",
]
automation = [
    "kaggle>=1.6",
    "mlflow>=2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
